{% extends 'base.html' %}

{% block title %}Add Spare Part{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 20px;">Register New Spare Part</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Category</label>
            <select name="category_id" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Part Name</label>
                <input type="text" name="name" placeholder="Front Brake Pads, Oil Filter, Spark Plug" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">OEM / Part Number (SKU)</label>
                <input type="text" name="part_number" placeholder="Enter the manufacturer part number or barcode" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Brand / Manufacturer</label>
                <input type="text" name="brand" placeholder="Honda, Toyota, Denso, Guard" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Shelf / Rack Location</label>
                <input type="text" name="shelf_location" placeholder="Rack A-2, Bin 12" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Compatible Vehicles</label>
            <input type="text" name="compatible_vehicles" placeholder="Honda Civic 2016-2022, CD 70, Corolla Gli" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Cost Price (Rs)</label>
                <input type="number" step="0.01" name="cost_price" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Sale Price (Rs)</label>
                <input type="number" step="0.01" name="selling_price" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Initial Stock</label>
                <input type="number" name="stock_quantity" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Alert Limit</label>
                <input type="number" name="min_stock_alert" value="5" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer;">Save Part To Inventory</button>
    </form>
</div>
{% endblock %}
