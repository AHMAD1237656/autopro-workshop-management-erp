{% extends 'base.html' %}

{% block title %}Record Payment Voucher{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 20px;">Record Financial Transaction</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Select Account Party</label>
            <select name="account_id" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                {% for acc in accounts %}
                    <option value="{{ acc.id }}">{{ acc.account_name }} ({{ acc.get_account_type_display }}) - Bal: Rs. {{ acc.current_balance }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Voucher Type</label>
                <select name="voucher_type" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                    <option value="RECEIPT">Payment Received (Inflow)</option>
                    <option value="PAYMENT">Payment Made (Outflow)</option>
                </select>
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Payment Channel</label>
                <select name="payment_mode" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                    <option value="CASH">Cash</option>
                    <option value="ONLINE">Bank Transfer / Online</option>
                    <option value="CHEQUE">Cheque</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Amount Settled (Rs)</label>
            <input type="number" step="0.01" name="amount" placeholder="0.00" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Reference Notes / Cheque Details</label>
            <input type="text" name="reference_note" placeholder="Cheque #12345, Online TXN Ref, Cash settlement..." required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer;">Post Payment & Update Ledger</button>
    </form>
</div>
{% endblock %}
