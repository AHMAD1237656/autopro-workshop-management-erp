{% extends 'base.html' %}

{% block title %}Add Vehicle to Showroom{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 20px;">Register Vehicle for Sale</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Vehicle Title</label>
            <input type="text" name="title" placeholder="e.g. Honda Civic RS Turbo 2022" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Chassis / VIN Number</label>
                <input type="text" name="vin_number" placeholder="Unique VIN string" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Engine Number</label>
                <input type="text" name="engine_number" placeholder="Unique Engine string" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Make</label>
                <input type="text" name="make" placeholder="Honda, Toyota" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Model</label>
                <input type="text" name="model_name" placeholder="Civic, Corolla" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Year</label>
                <input type="number" name="year" placeholder="2022" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Mileage (KM)</label>
                <input type="number" name="mileage" placeholder="32000" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Color</label>
                <input type="text" name="color" placeholder="White, Black" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Condition</label>
                <select name="condition" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                    <option value="USED">Pre-Owned / Used</option>
                    <option value="NEW">Brand New</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Purchase Cost (Rs)</label>
                <input type="number" step="0.01" name="purchase_cost" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Asking Sale Price (Rs)</label>
                <input type="number" step="0.01" name="selling_price" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Registration Status</label>
            <input type="text" name="registration_status" placeholder="For example, registered or application pending" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer;">Save Vehicle to Showroom</button>
    </form>
</div>
{% endblock %}
