{% extends 'base.html' %}

{% block title %}Record Stock Purchase{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 20px;">Receive Stock from Supplier</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Select Supplier</label>
            <select name="supplier_id" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.company_name }} ({{ s.name }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Select Spare Part to Replenish</label>
            <select name="part_id" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                {% for p in parts %}
                    <option value="{{ p.id }}">{{ p.name }} (OEM: {{ p.part_number }}) - Current Stock: {{ p.stock_quantity }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Units Received (Quantity)</label>
                <input type="number" name="quantity" min="1" value="10" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Purchase Cost per Unit (Rs)</label>
                <input type="number" step="0.01" name="cost_price" placeholder="450.00" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer;">Confirm Receiving & Increment Inventory Stock</button>
    </form>
</div>
{% endblock %}
